    .arena-perspective {
      perspective: 1100px;

    /* 꽃잎/반딧불이 애니메이션 */
    @keyframes float-particle {
      0% { transform: translateY(-10px) translateX(0px) rotate(0deg); opacity: 0; }
      20% { opacity: 0.85; }
      80% { opacity: 0.85; }
      100% { transform: translateY(380px) translateX(60px) rotate(360deg); opacity: 0; }
    }
    .particle-anim {
      animation: float-particle 7s infinite linear;
    }
    @keyframes pop-bounce {
      0%, 100% { transform: translateY(0px) scale(1); }
      50% { transform: translateY(-6px) scale(1.06); }
    }
    .unit-bounce {
      animation: pop-bounce 2.2s infinite ease-in-out;

    function createUnitInstance(champId, star = 1) {
      const base = CHAMPIONS.find(c => c.id === champId) || CHAMPIONS[0];
      const mult = star === 1 ? 1 : star === 2 ? 1.75 : 3.1;
      return {
        uid: `u_${++uidCounter}_${Math.random().toString(36).slice(2, 6)}`,
        champId: base.id,
        name: base.name,
        cost: base.cost,
        emoji: base.emoji,
        traits: base.traits,
        star,
        maxHp: Math.round(base.hp * mult),
        hp: Math.round(base.hp * mult),
        atk: Math.round(base.atk * mult),
        range: base.range,
        maxMana: base.maxMana,
        mana: 0,
        skillName: base.skillName,
        quote: base.quote,
        isQuestionSkill: !!base.isQuestionSkill,
        role: base.role,
        shield: 0,
        bubble: null

      const [avatarQuote, setAvatarQuote] = useState('스님·신부님 앞줄에 세우고 모솔은 구석에 띄워보세요!');
      const [showGuide, setShowGuide] = useState(false);

      // 상점 새로고침 함수
      const rollShop = (costGold = 0) => {
        if (costGold > 0 && gold < costGold) return;
        if (costGold > 0) setGold(g => g - costGold);
        const maxCostAllowed = level <= 3 ? 3 : level <= 5 ? 4 : 5;
        const pool = CHAMPIONS.filter(c => c.cost <= maxCostAllowed);
        const nextShop = Array.from({ length: 5 }, () => {
          const pick = pool[Math.floor(Math.random() * pool.length)];
          return { ...pick, purchased: false };
        });
        setShop(nextShop);
      };

      useEffect(() => {
        rollShop(0);
      }, []);

      // 3성 자동 합체 체크
      const tryAutoCombine = (nextBoard, nextBench) => {
        let merged = false;
        const allMap = {};
        nextBoard.forEach(u => {
          const key = `${u.champId}_${u.star}`;
          if (!allMap[key]) allMap[key] = [];
          allMap[key].push({ loc: 'board', u });
        });
        nextBench.forEach((u, idx) => {
          if (!u) return;
          const key = `${u.champId}_${u.star}`;
          if (!allMap[key]) allMap[key] = [];
          allMap[key].push({ loc: 'bench', u, idx });
        });

        for (const key of Object.keys(allMap)) {
          const list = allMap[key];
          if (list.length >= 3) {
            const targetStar = list[0].u.star + 1;
            if (targetStar > 3) continue;
            merged = true;
            const champId = list[0].u.champId;
            const firstBoard = list.find(item => item.loc === 'board');
            const toRemoveUids = new Set(list.slice(0, 3).map(i => i.u.uid));

            nextBoard = nextBoard.filter(u => !toRemoveUids.has(u.uid));
            nextBench = nextBench.map(u => (u && toRemoveUids.has(u.uid) ? null : u));

            const upgraded = createUnitInstance(champId, targetStar);
            upgraded.bubble = `⭐${targetStar}성 합체!!`;

            if (firstBoard) {
              nextBoard.push({ ...upgraded, row: firstBoard.u.row, col: firstBoard.u.col, team: 'ally' });
            } else {
              const emptyIdx = nextBench.findIndex(x => x === null);
              if (emptyIdx !== -1) nextBench[emptyIdx] = upgraded;
            }
            setAvatarQuote(`🎉 ${upgraded.name} ★${targetStar}성 합체 성공!!`);
            break;
          }
        }
        if (merged) {
          return tryAutoCombine(nextBoard, nextBench);
        }
        return { nextBoard, nextBench };
      };

      // 활성 시너지 및 모솔 고독 판정 계산
      const { activeSynergies, isolatedUids, hiddenComboActive } = useMemo(() => {
        const traitMap = {};
        const isoSet = new Set();

        boardUnits.forEach(u => {
          // 고유 챔피언 종류별 시너지 카운트
          u.traits.forEach(t => {
            if (!traitMap[t]) traitMap[t] = new Set();
            traitMap[t].add(u.champId);
          });
          // 모솔 고독 체크 (주변 8칸 내 다른 아군 없는지 확인)
          if (u.traits.includes('mosol')) {
            const hasNeighbor = boardUnits.some(other =>
              other.uid !== u.uid &&
              Math.abs(other.row - u.row) <= 1 &&
              Math.abs(other.col - u.col) <= 1
            );
            if (!hasNeighbor) isoSet.add(u.uid);
          }
        });

        const counts = {};
        Object.keys(SYNERGIES).forEach(k => {
          counts[k] = traitMap[k] ? traitMap[k].size : 0;
        });

        const hidden = counts.mosol >= 1 && counts.celibate >= 2;
        return { activeSynergies: counts, isolatedUids: isoSet, hiddenComboActive: hidden };
      }, [boardUnits]);

      // 준비 단계 타이머
      useEffect(() => {
        if (phase !== 'PREP') return;
        const id = setInterval(() => {
          setTimer(t => {
            if (t <= 1) {
              startCombat();
              return 0;
            }
            return t - 1;
          });
        }, 1000);
        return () => clearInterval(id);
      }, [phase, boardUnits, benchUnits, waveIdx]);

      // 단축키 지원 (D: 리롤, F: 경험치 구매, Space: 즉시 전투)
      useEffect(() => {
        const onKey = (e) => {
          if (phase !== 'PREP') return;
          if (e.key === 'd' || e.key === 'D') rollShop(2);
          if (e.key === 'f' || e.key === 'F') buyXp();
          if (e.code === 'Space') {
            e.preventDefault();
            startCombat();
          }
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, [phase, gold, level, xp, boardUnits]);

      // 경험치 구매 (레벨업)
      const buyXp = () => {
        if (gold < 4 || level >= 8) return;
        setGold(g => g - 4);
        const nextXp = xp + 4;
        const need = level * 4;
        if (nextXp >= need) {
          setLevel(l => l + 1);
          setXp(nextXp - need);
          setAvatarQuote(`연애세포 레벨 UP! 이제 전장에 최대 ${level + 1}명 배치 가능!`);
        } else {
          setXp(nextXp);
        }
      };

      // 상점 기물 구매
      const buyChampion = (idx) => {
        if (phase !== 'PREP') return;
        const item = shop[idx];
        if (!item || item.purchased || gold < item.cost) return;

        const emptyBenchIdx = benchUnits.findIndex(b => b === null);
        if (emptyBenchIdx === -1) {
          setAvatarQuote('대기석(벤치)이 꽉 찼습니다! 기물을 배치하거나 판매하세요.');
          return;
        }

        setGold(g => g - item.cost);
        const nextShop = [...shop];
        nextShop[idx] = { ...item, purchased: true };
        setShop(nextShop);

        const newUnit = createUnitInstance(item.id, 1);
        const rawBench = [...benchUnits];
        rawBench[emptyBenchIdx] = newUnit;

        const { nextBoard, nextBench } = tryAutoCombine([...boardUnits], rawBench);
        setBoardUnits(nextBoard);
        setBenchUnits(nextBench);
      };

      // 선택된 기물 판매
      const sellSelectedUnit = () => {
        if (!selectedSource || phase !== 'PREP') return;
        if (selectedSource.type === 'board') {
          const target = boardUnits.find(u => u.uid === selectedSource.uid);
          if (!target) return;
          const refund = target.cost * target.star;
          setGold(g => g + refund);
          setBoardUnits(prev => prev.filter(u => u.uid !== target.uid));
        } else if (selectedSource.type === 'bench') {
          const target = benchUnits[selectedSource.index];
          if (!target) return;
          const refund = target.cost * target.star;
          setGold(g => g + refund);
          setBenchUnits(prev => prev.map((u, i) => (i === selectedSource.index ? null : u)));
        }
        setSelectedSource(null);
      };

      // 타일 클릭 이동/교체
      const handleTileClick = (row, col) => {
        if (phase !== 'PREP') return;
        if (row < 2) return; // 적 진영 배치 불가

        const existingOnTile = boardUnits.find(u => u.row === row && u.col === col);

        if (!selectedSource) {
          if (existingOnTile) {
            setSelectedSource({ type: 'board', uid: existingOnTile.uid, row, col });
          }
          return;
        }

        // 보드 -> 보드 이동/교체
        if (selectedSource.type === 'board') {
          const movingUnit = boardUnits.find(u => u.uid === selectedSource.uid);
          if (!movingUnit) {
            setSelectedSource(null);
            return;
          }
          if (existingOnTile && existingOnTile.uid === movingUnit.uid) {
            setSelectedSource(null);
            return;
          }
          setBoardUnits(prev =>
            prev.map(u => {
              if (u.uid === movingUnit.uid) return { ...u, row, col };
              if (existingOnTile && u.uid === existingOnTile.uid) {
                return { ...u, row: movingUnit.row, col: movingUnit.col };
              }
              return u;
            })
          );
          setSelectedSource(null);
        }
        // 벤치 -> 보드 배치/교체
        else if (selectedSource.type === 'bench') {
          const benchUnit = benchUnits[selectedSource.index];
          if (!benchUnit) {
            setSelectedSource(null);
            return;
          }
          if (!existingOnTile && boardUnits.length >= level) {
            setAvatarQuote(`현재 레벨(${level}) 최대 인원 초과! 경험치를 구매해 레벨업하세요.`);
            setSelectedSource(null);
            return;
          }
          if (existingOnTile) {
            // 스왑
            setBoardUnits(prev =>
              prev.map(u => (u.uid === existingOnTile.uid ? { ...benchUnit, row, col, team: 'ally' } : u))
            );
            setBenchUnits(prev => prev.map((u, i) => (i === selectedSource.index ? existingOnTile : u)));
          } else {
            setBoardUnits(prev => [...prev, { ...benchUnit, row, col, team: 'ally' }]);
            setBenchUnits(prev => prev.map((u, i) => (i === selectedSource.index ? null : u)));
          }
          setSelectedSource(null);
        }
      };

      // 벤치 슬롯 클릭
      const handleBenchClick = (idx) => {
        if (phase !== 'PREP') return;
        const clickedUnit = benchUnits[idx];

        if (!selectedSource) {
          if (clickedUnit) setSelectedSource({ type: 'bench', index: idx, uid: clickedUnit.uid });
          return;
        }

        if (selectedSource.type === 'bench') {
          const fromIdx = selectedSource.index;
          if (fromIdx === idx) {
            setSelectedSource(null);
            return;
          }
          const copy = [...benchUnits];
          const temp = copy[fromIdx];
          copy[fromIdx] = copy[idx];
          copy[idx] = temp;
          setBenchUnits(copy);
          setSelectedSource(null);
        } else if (selectedSource.type === 'board') {
          const boardUnit = boardUnits.find(u => u.uid === selectedSource.uid);
          if (!boardUnit) {
            setSelectedSource(null);
            return;
          }
          if (clickedUnit) {
            setBoardUnits(prev =>
              prev.map(u => (u.uid === boardUnit.uid ? { ...clickedUnit, row: boardUnit.row, col: boardUnit.col, team: 'ally' } : u))
            );
            setBenchUnits(prev => prev.map((u, i) => (i === idx ? { ...boardUnit } : u)));
          } else {
            setBoardUnits(prev => prev.filter(u => u.uid !== boardUnit.uid));
            setBenchUnits(prev => prev.map((u, i) => (i === idx ? { ...boardUnit } : u)));
          }
          setSelectedSource(null);
        }
      };

      // 원클릭 명장면 프리셋 세팅
      const applyHighlightPreset = () => {
        if (phase !== 'PREP') return;
        const presetBoard = [
          { ...createUnitInstance('c5', 2), row: 2, col: 2, team: 'ally' },  // 2성 산속의 스님
          { ...createUnitInstance('c9', 2), row: 2, col: 4, team: 'ally' },  // 2성 고해성사 신부님
          { ...createUnitInstance('c16', 1), row: 2, col: 3, team: 'ally' }, // 해탈한 주지스님
          { ...createUnitInstance('c17', 2), row: 3, col: 0, team: 'ally' }  // 2성 30년차 대마법사 (고독 배치)
        ];
        setBoardUnits(presetBoard);
        setWaveIdx(1); // "오빠 나 달라진 거 없어?" 폭격단 스테이지로 고정
        setAvatarQuote('🔥 스님·신부님 철벽 + 모솔 대마법사 세팅 완료! [즉시 전투]를 눌러보세요!');
      };

      // 전투 시작
      const startCombat = () => {
        if (phase !== 'PREP') return;
        setSelectedSource(null);

        // 만약 보드에 기물이 하나도 없고 벤치에 있으면 1개 자동 투입
        let currentAllies = [...boardUnits];
        if (currentAllies.length === 0) {
          const firstBenchIdx = benchUnits.findIndex(u => u !== null);
          if (firstBenchIdx !== -1) {
            const autoUnit = { ...benchUnits[firstBenchIdx], row: 2, col: 3, team: 'ally' };
            currentAllies = [autoUnit];
            setBoardUnits(currentAllies);
            setBenchUnits(prev => prev.map((u, i) => (i === firstBenchIdx ? null : u)));
          }
        }

        const wave = ENEMY_WAVES[waveIdx % ENEMY_WAVES.length];
        const allies = currentAllies.map(u => {
          const isIso = isolatedUids.has(u.uid);
          const initShield =
            (isIso ? Math.round(u.maxHp * 0.35) : 0) +
            (activeSynergies.pure >= 2 ? 180 : 0);
          // 직진 시너지 점프 처리
          const startRow = u.traits.includes('straight') && activeSynergies.straight >= 2 ? 0 : u.row;
          return {
            ...u,
            hp: u.maxHp,
            mana: 0,
            shield: initShield,
            row: startRow,
            team: 'ally',
            isIsolatedMosol: isIso,
            awakened: false,
            bubble: isIso ? '👑고독 철벽!' : u.traits.includes('straight') && activeSynergies.straight >= 2 ? '🚀직진 돌격!' : null
          };
        });

        const enemies = wave.units.map(eu => {
          const inst = createUnitInstance(eu.champId, eu.star);
          return {
            ...inst,
            row: eu.row,
            col: eu.col,
            team: 'enemy',
            shield: 0,
            bubble: null
          };
        });

        setCombatUnits([...allies, ...enemies]);
        setCombatLogs([`⚔️ [${wave.stage} ${wave.title}] 전투가 시작되었습니다!`]);
        setPhase('COMBAT');
      };

      // 실시간 전투 틱 루프
      useEffect(() => {
        if (phase !== 'COMBAT') return;
        let tickCount = 0;

        const id = setInterval(() => {
          tickCount += 1;
          setCombatUnits(prev => {
            const alive = prev.filter(u => u.hp > 0);
            const allies = alive.filter(u => u.team === 'ally');
            const enemies = alive.filter(u => u.team === 'enemy');

            if (allies.length === 0 || enemies.length === 0) {
              const isWin = allies.length > 0;
              finishCombat(isWin, enemies.length);
              return prev;
            }

            const next = alive.map(u => ({ ...u, bubble: tickCount % 3 === 0 ? null : u.bubble }));
            const newLogs = [];

            next.forEach(actor => {
              if (actor.hp <= 0) return;

              // 5틱 후 모솔 대마법사 각성
              if (tickCount === 5 && actor.team === 'ally' && actor.isIsolatedMosol && !actor.awakened) {
                actor.awakened = true;
                actor.atk = Math.round(actor.atk * 1.9);
                actor.bubble = '⚡대마법사 각성!!';
                newLogs.push(`🧙‍♂️ [모솔 각성] ${actor.name}의 솔로 마력이 폭발해 공격력이 2배 증가합니다!`);
              }

              const foes = next.filter(f => f.team !== actor.team && f.hp > 0);
              if (foes.length === 0) return;

              // 가장 가까운 적 탐색
              let target = foes[0];
              let minDist = 999;
              foes.forEach(f => {
                const d = Math.abs(f.row - actor.row) + Math.abs(f.col - actor.col);
                if (d < minDist) {
                  minDist = d;
                  target = f;
                }
              });

              // 사거리 밖이면 1칸 이동
              if (minDist > actor.range) {
                const dRow = Math.sign(target.row - actor.row);
                const dCol = Math.sign(target.col - actor.col);
                const candRow = Math.max(0, Math.min(3, actor.row + dRow));
                const candCol = Math.max(0, Math.min(6, actor.col + (dRow === 0 ? dCol : 0)));
                const occupied = next.some(o => o.uid !== actor.uid && o.hp > 0 && o.row === candRow && o.col === candCol);
                if (!occupied) {
                  actor.row = candRow;
                  actor.col = candCol;
                }
                return;
              }

              // 평타 및 마나 충전
              actor.mana = Math.min(actor.maxMana, actor.mana + 25);

              if (actor.mana >= actor.maxMana) {
                actor.mana = 0;
                actor.bubble = `💬 ${actor.quote}`;

                // 공포의 연애 질문 스킬 vs 독신주의(스님·신부님·비혼러) 해탈 카운터 판정!
                if (actor.isQuestionSkill && target.traits.includes('celibate')) {
                  const healAmt = 160;
                  target.hp = Math.min(target.maxHp, target.hp + healAmt);
                  target.bubble =
                    target.champId === 'c9'
                      ? '✝️ 주님 안에선 어제나 오늘이나 똑같습니다 (피해 0!)'
                      : '📿 시주님, 머리카락도 인연도 본래 공(空)하거늘! (해탈 반사!)';
                  newLogs.push(`📿 [해탈 카운터!] ${target.name}이(가) "${actor.skillName}" 질문을 속세 초월 멘트로 완벽 무효화하고 체력을 +${healAmt} 회복했습니다!`);
                  return;
                }

                // 모솔/극T가 질문 스킬 맞으면 오답 크리티컬
                let skillDmg = Math.round(actor.atk * 2.2);
                if (actor.isQuestionSkill && (target.traits.includes('mosol') || target.traits.includes('mbti_t'))) {
                  skillDmg = Math.round(actor.atk * 2.9);
                  target.bubble = '😳 어...? 어제랑 똑같은 옷 아니야?! (오답 크리!)';
                  newLogs.push(`💥 [오답 대참사] ${target.name}이(가) "${actor.skillName}"에 팩트로 대답했다가 ${skillDmg} 멘탈 폭격을 맞았습니다!`);
                } else {
                  newLogs.push(`✨ [${actor.name}] 스킬 발동: "${actor.quote}" (${skillDmg} 피해)`);
                }

                // 솔로천국 커플지옥 히든 증폭
                if (actor.team === 'ally' && hiddenComboActive && target.star >= 2) {
                  skillDmg = Math.round(skillDmg * 1.4);
                }

                applyDamage(target, skillDmg);

                // 극F 아군 치유
                if (actor.traits.includes('mbti_f')) {
                  const friends = next.filter(f => f.team === actor.team && f.hp > 0);
                  friends.sort((a, b) => a.hp / a.maxHp - b.hp / b.maxHp);
                  if (friends[0]) {
                    friends[0].hp = Math.min(friends[0].maxHp, friends[0].hp + 130);
                  }
                }
              } else {
                // 일반 공격
                let dmg = actor.atk;
                if (actor.team === 'ally' && activeSynergies.mbti_t >= 2 && actor.traits.includes('mbti_t')) {
                  dmg += 35; // 극T 고정 피해
                }
                applyDamage(target, dmg);
              }
            });

            if (newLogs.length > 0) {
              setCombatLogs(l => [...newLogs.slice(0, 2), ...l].slice(0, 8));
            }
            return next;
          });
        }, 650);

        return () => clearInterval(id);
      }, [phase, hiddenComboActive, activeSynergies]);

      function applyDamage(target, dmg) {
        if (target.shield > 0) {
          if (target.shield >= dmg) {
            target.shield -= dmg;
            return;
          } else {
            dmg -= target.shield;
            target.shield = 0;
          }
        }
        target.hp = Math.max(0, target.hp - dmg);
      }

      // 전투 종료 및 정산
      const finishCombat = (isWin, survivingEnemies) => {
        setPhase('RESULT');
        const interest = Math.min(5, Math.floor(gold / 10));
        const baseReward = 5 + (isWin ? 1 : 0);
        const totalEarn = baseReward + interest;

        if (isWin) {
          setStreak(s => (s >= 0 ? s + 1 : 1));
          setBannerMsg({
            win: true,
            title: '🎉 소개팅 배틀 승리! (솔로 천국!)',
            sub: `획득 골드: 기본 ${baseReward}G + 이자 ${interest}G = +${totalEarn}G`
          });
        } else {
          const hpLoss = survivingEnemies * 8;
          setPlayerHp(h => Math.max(0, h - hpLoss));
          setStreak(s => (s <= 0 ? s - 1 : -1));
          setBannerMsg({
            win: false,
            title: `💔 멘탈 데미지 -${hpLoss} (라운드 패배)`,
            sub: `획득 골드: 기본 ${baseReward}G + 이자 ${interest}G = +${totalEarn}G`
          });
        }

        setTimeout(() => {
          setGold(g => g + totalEarn);
          setWaveIdx(w => w + 1);
          setBannerMsg(null);
          setTimer(25);
          setPhase('PREP');
          if (!shopLocked) rollShop(0);
        }, 2500);
      };

      const currentWave = ENEMY_WAVES[waveIdx % ENEMY_WAVES.length];
      const interestCount = Math.min(5, Math.floor(gold / 10));

      // 렌더링할 유닛 목록 (전투 중엔 combatUnits, 준비 중엔 내 보드 + 적 스카우팅 보드)
      const displayUnits = useMemo(() => {
        if (phase === 'COMBAT' || phase === 'RESULT') {
          return combatUnits.filter(u => u.hp > 0);
        }
        const enemyPreview = currentWave.units.map((eu, i) => ({
          ...createUnitInstance(eu.champId, eu.star),
          uid: `preview_${i}`,
          row: eu.row,
          col: eu.col,
          team: 'enemy'
        }));
        return [...boardUnits, ...enemyPreview];
      }, [phase, combatUnits, boardUnits, currentWave]);

      return (
        <div className="min-h-screen w-full bg-[#070913] text-slate-100 flex flex-col justify-between p-2 md:p-3 select-none overflow-hidden">
          {/* 상단 HUD: 스테이지 & 타이머 & 스킨 스위치 & 원클릭 프리셋 */}

                          🪙 {card.cost}
                        </span>
                      </div>
                      <div>
                        <div className="text-xs font-black text-white truncate">{card.name}</div>
                        <div className="flex flex-wrap gap-1 mt-0.5">
                          {card.traits.map(t => (
                            <span key={t} className="text-[9px] font-bold px-1 rounded bg-black/40 text-slate-200">
                              {SYNERGIES[t].icon} {SYNERGIES[t].name}
                            </span>
                          ))}
                        </div>
                      </div>
                    </div>
                  );
                })}
              </div>

              {/* 우측 보유 골드 & 이자 & 잠금 */}
              <div className="md:col-span-2 flex md:flex-col items-center justify-between bg-slate-950/90 border border-amber-500/40 rounded-xl p-2.5">
                <div className="flex items-center gap-1.5">
                  <span className="text-2xl">🪙</span>
                  <div>
                    <div className="text-xl font-black text-amber-300 leading-none">{gold} G</div>
                    <div className="text-[10px] text-slate-400 font-bold mt-0.5">
                      이자 +{interestCount}G / 연승 {streak}
                    </div>
                  </div>
                </div>
                <button
                  onClick={() => setShopLocked(!shopLocked)}
                  className={`mt-1 w-full py-1 rounded-lg text-[11px] font-bold border ${
                    shopLocked
                      ? 'bg-amber-500 text-slate-950 border-amber-300'
                      : 'bg-slate-800 text-slate-300 border-slate-700'
                  }`}
                >
                  {shopLocked ? '🔒 상점 잠금중' : '🔓 상점 잠금'}
                </button>
              </div>
            </div>
          </footer>

          {/* 18종 전체 기물 도감 모달 */}
          {showGuide && (
            <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-slate-900 border border-slate-700 rounded-2xl max-w-4xl w-full max-h-[85vh] overflow-y-auto p-5">
                <div className="flex items-center justify-between pb-3 border-b border-slate-800">
                  <h2 className="text-lg font-black text-amber-300">📖 연애적 팀 전투 - 전체 기물 & 스킬 도감</h2>
                  <button
                    onClick={() => setShowGuide(false)}
                    className="px-3 py-1 rounded-lg bg-rose-600 text-white text-xs font-bold"
                  >
                    닫기 ✕
                  </button>
                </div>
                <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-2.5 mt-4">
                  {CHAMPIONS.map(c => (
                    <div key={c.id} className="p-3 rounded-xl bg-slate-950 border border-slate-800 flex flex-col gap-1">
                      <div className="flex items-center justify-between">
                        <span className="font-black text-sm text-white">{c.emoji} {c.name}</span>
                        <span className="text-xs font-bold text-amber-400">{c.cost}코스트</span>
                      </div>
                      <div className="text-[11px] text-sky-300 font-bold">
                        시너지: {c.traits.map(t => `${SYNERGIES[t].icon}${SYNERGIES[t].name}`).join(' · ')}
                      </div>
                      <div className="text-[11px] text-slate-300">
                        스킬: <b>{c.skillName}</b>
                      </div>
                      <div className="text-[11px] text-amber-200/90 italic">
                        "{c.quote}"
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
