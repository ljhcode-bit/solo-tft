<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>TFT: 솔로지옥 v7.1 - 무결성 에디션</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/htm/3.1.1/htm.umd.js"></script>
  <style>
    @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
    * { box-sizing: border-box; user-select: none; }
    body {
      margin: 0; padding: 0;
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #05070e; color: #f8fafc; overflow: hidden;
    }
    .tft-stage-wrap { perspective: 1300px; }
    .tft-arena-surface {
      transform: rotateX(12deg);
      transform-style: preserve-3d;
      box-shadow: 0 22px 0 #0f172a, 0 35px 70px rgba(0,0,0,0.9), inset 0 2px 20px rgba(255,255,255,0.12);
    }
    @keyframes idle-breathe {
      0%, 100% { transform: translateY(0) scaleY(1); }
      50% { transform: translateY(-4px) scaleY(1.03); }
    }
    @keyframes lunge-up {
      0% { transform: translateY(0) scale(1); }
      40% { transform: translateY(-22px) scale(1.18); }
      100% { transform: translateY(0) scale(1); }
    }
    @keyframes lunge-down {
      0% { transform: translateY(0) scale(1); }
      40% { transform: translateY(22px) scale(1.18); }
      100% { transform: translateY(0) scale(1); }
    }
    @keyframes hit-shake {
      0%, 100% { transform: translateX(0); filter: brightness(1); }
      25% { transform: translateX(-6px); filter: brightness(2) drop-shadow(0 0 10px #f43f5e); }
      75% { transform: translateX(6px); filter: brightness(1.8); }
    }
    @keyframes float-dmg {
      0% { transform: translate(-50%, 0) scale(0.7); opacity: 1; }
      35% { transform: translate(-50%, -18px) scale(1.15); opacity: 1; }
      100% { transform: translate(-50%, -36px) scale(0.95); opacity: 0; }
    }
    .anim-idle { animation: idle-breathe 2s infinite ease-in-out; }
    .anim-lunge-ally { animation: lunge-up 0.38s ease-out; }
    .anim-lunge-enemy { animation: lunge-down 0.38s ease-out; }
    .anim-hit { animation: hit-shake 0.32s ease-in-out; }
    .anim-float { animation: float-dmg 0.85s ease-out forwards; }
  </style>
</head>
<body>
  <!-- 로딩 및 에러 진단용 기본 화면 (React가 켜지면 자동으로 사라짐) -->
  <div id="root">
    <div style="height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fbbf24;font-weight:bold;">
      <div>⚔️ 결투장 데이터를 불러오는 중입니다...</div>
      <div id="err-box" style="color:#f43f5e;font-size:12px;margin-top:10px;max-width:80%;"></div>

      var el = document.getElementById('err-box');

    };

    const { useState, useEffect, useMemo } = React;
    const html = htm.bind(React.createElement);

      { stage: '1-2', units: [{ champId: 'c3', star: 1, row: 1, col: 2 }, { champId: 'c6', star: 1, row: 1, col: 5 }, { champId: 'c10', star: 1, row: 0, col: 3 }] },
      { stage: '1-3', units: [{ champId: 'c11', star: 2, row: 1, col: 2 }, { champId: 'c10', star: 1, row: 0, col: 1 }, { champId: 'c14', star: 1, row: 0, col: 5 }] },
      { stage: '2-1', units: [{ champId: 'c15', star: 2, row: 1, col: 3 }, { champId: 'c10', star: 2, row: 0, col: 1 }, { champId: 'c18', star: 2, row: 1, col: 5 }] }
    ];

    let uidSeq = 1;
    function spawnUnit(champId, star = 1) {
      const base = CHAMPIONS.find(c => c.id === champId) || CHAMPIONS[0];
      const mult = star === 1 ? 1 : star === 2 ? 1.75 : 3.1;
      return {
        uid: `u_${++uidSeq}_${Math.random().toString(36).slice(2, 5)}`,
        champId: base.id, name: base.name, cost: base.cost, traits: base.traits, star,
        maxHp: Math.round(base.hp * mult), hp: Math.round(base.hp * mult),
        atk: Math.round(base.atk * mult), range: base.range, maxMana: base.maxMana,
        mana: 0, popText: base.popText, isQuestion: !!base.isQuestion,
        shield: 0, popup: null, popupColor: '', animState: ''
      };
    }

    function App() {
      const [arenaId, setArenaId] = useState('temple');
      const arena = ARENAS[arenaId];
      const [stageIdx, setStageIdx] = useState(1);
      const [phase, setPhase] = useState('PREP');
      const [timeLeft, setTimeLeft] = useState(25);
      const [hp, setHp] = useState(100);
      const [gold, setGold] = useState(16);
      const [level, setLevel] = useState(4);
      const [xp, setXp] = useState(0);

      const [boardUnits, setBoardUnits] = useState(() => [
        { ...spawnUnit('c5', 2), row: 2, col: 2, team: 'ally' },
        { ...spawnUnit('c9', 2), row: 2, col: 4, team: 'ally' },
        { ...spawnUnit('c12', 1), row: 3, col: 0, team: 'ally' },
        { ...spawnUnit('c17', 1), row: 3, col: 6, team: 'ally' }
      ]);
      const [benchUnits, setBenchUnits] = useState(() => [
        spawnUnit('c1', 1), spawnUnit('c7', 1), spawnUnit('c8', 1),
        null, null, null, null, null, null
      ]);

      const [shop, setShop] = useState([]);
      const [selected, setSelected] = useState(null);
      const [dragSource, setDragSource] = useState(null);
      const [combatUnits, setCombatUnits] = useState([]);
      const [banner, setBanner] = useState(null);

      const rollShop = (cost = 0) => {
        if (cost > 0 && gold < cost) return;
        if (cost > 0) setGold(g => g - cost);
        setShop(Array.from({ length: 5 }, () => ({
          ...CHAMPIONS[Math.floor(Math.random() * CHAMPIONS.length)],
          sold: false
        })));
      };

      useEffect(() => { rollShop(0); }, []);

      const tryCombine = (bList, benchList) => {
        const map = {};
        bList.forEach(u => {
          const k = `${u.champId}_${u.star}`;
          if (!map[k]) map[k] = [];
          map[k].push({ loc: 'board', u });
        });
        benchList.forEach((u, idx) => {
          if (!u) return;
          const k = `${u.champId}_${u.star}`;
          if (!map[k]) map[k] = [];
          map[k].push({ loc: 'bench', u, idx });
        });

        for (const k of Object.keys(map)) {
          const arr = map[k];
          if (arr.length >= 3 && arr[0].u.star < 3) {
            const nextStar = arr[0].u.star + 1;
            const cid = arr[0].u.champId;
            const rm = new Set(arr.slice(0, 3).map(x => x.u.uid));
            const bTarget = arr.find(x => x.loc === 'board');

            bList = bList.filter(u => !rm.has(u.uid));
            benchList = benchList.map(u => (u && rm.has(u.uid) ? null : u));

            const upgraded = spawnUnit(cid, nextStar);
            upgraded.popup = `★${nextStar}성!`;
            upgraded.popupColor = 'bg-amber-300 text-slate-950';

            if (bTarget) {
              bList.push({ ...upgraded, row: bTarget.u.row, col: bTarget.u.col, team: 'ally' });
            } else {
              const empty = benchList.findIndex(x => x === null);
              if (empty !== -1) benchList[empty] = upgraded;
            }
            return tryCombine(bList, benchList);
          }
        }
        return { bList, benchList };
      };

      const { traitCounts, isolatedSet, comboActive } = useMemo(() => {
        const tMap = {};
        const iso = new Set();
        boardUnits.forEach(u => {
          u.traits.forEach(t => {
            if (!tMap[t]) tMap[t] = new Set();
            tMap[t].add(u.champId);
          });
          if (u.traits.includes('mosol')) {
            const hasNeighbor = boardUnits.some(o =>
              o.uid !== u.uid && Math.abs(o.row - u.row) <= 1 && Math.abs(o.col - u.col) <= 1
            );
            if (!hasNeighbor) iso.add(u.uid);
          }
        });
        const counts = {};
        Object.keys(SYNERGIES).forEach(k => { counts[k] = tMap[k] ? tMap[k].size : 0; });
        return { traitCounts: counts, isolatedSet: iso, comboActive: counts.mosol >= 1 && counts.celibate >= 2 };
      }, [boardUnits]);

      useEffect(() => {
        if (phase !== 'PREP') return;
        const id = setInterval(() => {
          setTimeLeft(t => {
            if (t <= 1) { startCombat(); return 0; }
            return t - 1;
          });
        }, 1000);
        return () => clearInterval(id);
      }, [phase, boardUnits, stageIdx]);

      const buyXp = () => {
        if (phase !== 'PREP' || gold < 4 || level >= 8) return;
        setGold(g => g - 4);
        const nx = xp + 4;
        const req = level * 4;
        if (nx >= req) { setLevel(l => l + 1); setXp(nx - req); }
        else setXp(nx);
      };

      const buyCard = (idx) => {
        if (phase !== 'PREP') return;
        const card = shop[idx];
        if (!card || card.sold || gold < card.cost) return;
        const emptyIdx = benchUnits.findIndex(u => u === null);
        if (emptyIdx === -1) return;

        setGold(g => g - card.cost);
        const nextShop = [...shop];
        nextShop[idx] = { ...card, sold: true };
        setShop(nextShop);

        const nextBench = [...benchUnits];
        nextBench[emptyIdx] = spawnUnit(card.id, 1);
        const res = tryCombine([...boardUnits], nextBench);
        setBoardUnits(res.bList);
        setBenchUnits(res.benchList);
      };

      const moveUnit = (src, dest) => {
        if (!src || phase !== 'PREP') return;
        if (dest.type === 'sell') {
          if (src.from === 'board') {
            const u = boardUnits.find(x => x.uid === src.uid);
            if (u) { setGold(g => g + u.cost * u.star); setBoardUnits(prev => prev.filter(x => x.uid !== u.uid)); }
          } else {
            const u = benchUnits[src.index];
            if (u) { setGold(g => g + u.cost * u.star); setBenchUnits(prev => prev.map((x, i) => i === src.index ? null : x)); }
          }
          setSelected(null);
          return;
        }
        if (dest.type === 'board') {
          const { row, col } = dest;
          if (row < 2) return;
          const targetOnTile = boardUnits.find(u => u.row === row && u.col === col);
          if (src.from === 'board') {
            const moving = boardUnits.find(u => u.uid === src.uid);
            if (!moving) return;
            setBoardUnits(prev => prev.map(u => {
              if (u.uid === moving.uid) return { ...u, row, col };
              if (targetOnTile && u.uid === targetOnTile.uid) return { ...u, row: moving.row, col: moving.col };
              return u;
            }));
          } else {
            const benchU = benchUnits[src.index];
            if (!benchU) return;
            if (!targetOnTile && boardUnits.length >= level) return;
            if (targetOnTile) {
              setBoardUnits(prev => prev.map(u => u.uid === targetOnTile.uid ? { ...benchU, row, col, team: 'ally' } : u));
              setBenchUnits(prev => prev.map((u, i) => i === src.index ? targetOnTile : u));
            } else {
              setBoardUnits(prev => [...prev, { ...benchU, row, col, team: 'ally' }]);
              setBenchUnits(prev => prev.map((u, i) => i === src.index ? null : u));
            }
          }
          setSelected(null);
        }
        if (dest.type === 'bench') {
          const idx = dest.index;
          const slotU = benchUnits[idx];
          if (src.from === 'bench') {
            const copy = [...benchUnits];
            const tmp = copy[src.index];
            copy[src.index] = copy[idx];
            copy[idx] = tmp;
            setBenchUnits(copy);
          } else {
            const bUnit = boardUnits.find(u => u.uid === src.uid);
            if (!bUnit) return;
            if (slotU) {
              setBoardUnits(prev => prev.map(u => u.uid === bUnit.uid ? { ...slotU, row: bUnit.row, col: bUnit.col, team: 'ally' } : u));
              setBenchUnits(prev => prev.map((u, i) => i === idx ? bUnit : u));
            } else {
              setBoardUnits(prev => prev.filter(u => u.uid !== bUnit.uid));
              setBenchUnits(prev => prev.map((u, i) => i === idx ? bUnit : u));
            }
          }
          setSelected(null);
        }
      };

      const startCombat = () => {
        if (phase !== 'PREP') return;
        setSelected(null);
        const stg = STAGES[stageIdx % STAGES.length];
        const allies = boardUnits.map(u => {
          const isIso = isolatedSet.has(u.uid);
          return {
            ...u, hp: u.maxHp, mana: 0,
            shield: (isIso ? Math.round(u.maxHp * 0.35) : 0) + (traitCounts.pure >= 2 ? 200 : 0),
            row: u.traits.includes('straight') && traitCounts.straight >= 2 ? 0 : u.row,
            team: 'ally', isIso, awakened: false,
            popup: isIso ? '👑고독' : null, popupColor: 'bg-purple-500 text-white', animState: ''
          };
        });
        const enemies = stg.units.map(eu => ({ ...spawnUnit(eu.champId, eu.star), row: eu.row, col: eu.col, team: 'enemy' }));
        setCombatUnits([...allies, ...enemies]);
        setPhase('COMBAT');
      };

      useEffect(() => {
        if (phase !== 'COMBAT') return;
        let tick = 0;
        const id = setInterval(() => {
          tick += 1;
          setCombatUnits(prev => {
            const alive = prev.filter(u => u.hp > 0);
            const allies = alive.filter(u => u.team === 'ally');
            const enemies = alive.filter(u => u.team === 'enemy');
            if (!allies.length || !enemies.length) {
              finishCombat(allies.length > 0, enemies.length);
              return prev;
            }
            const next = alive.map(u => ({ ...u, popup: null, animState: '' }));
            next.forEach(actor => {
              if (actor.hp <= 0) return;
              if (tick === 4 && actor.team === 'ally' && actor.isIso && !actor.awakened) {
                actor.awakened = true;
                actor.atk = Math.round(actor.atk * 1.9);
                actor.popup = '⚡각성!';
                actor.popupColor = 'bg-purple-400 text-slate-950';
              }
              const foes = next.filter(f => f.team !== actor.team && f.hp > 0);
              if (!foes.length) return;
              let target = foes[0];
              let minDist = 99;
              foes.forEach(f => {
                const d = Math.abs(f.row - actor.row) + Math.abs(f.col - actor.col);
                if (d < minDist) { minDist = d; target = f; }
              });
              if (minDist > actor.range) {
                const dr = Math.sign(target.row - actor.row);
                const dc = Math.sign(target.col - actor.col);
                const nr = Math.max(0, Math.min(3, actor.row + dr));
                const nc = Math.max(0, Math.min(6, actor.col + (dr === 0 ? dc : 0)));
                if (!next.some(o => o.uid !== actor.uid && o.hp > 0 && o.row === nr && o.col === nc)) {
                  actor.row = nr; actor.col = nc;
                }
                return;
              }
              actor.animState = actor.team === 'ally' ? 'anim-lunge-ally' : 'anim-lunge-enemy';
              target.animState = 'anim-hit';
              actor.mana = Math.min(actor.maxMana, actor.mana + 25);

              if (actor.mana >= actor.maxMana) {
                actor.mana = 0;
                actor.popup = actor.popText;
                actor.popupColor = 'bg-amber-300 text-slate-950';
                if (actor.isQuestion && target.traits.includes('celibate')) {
                  target.hp = Math.min(target.maxHp, target.hp + 180);
                  target.popup = '📿0 해탈! +180';
                  target.popupColor = 'bg-amber-400 text-slate-950';
                  return;
                }
                let dmg = Math.round(actor.atk * 2.2);
                if (actor.isQuestion && (target.traits.includes('mosol') || target.traits.includes('mbti_t'))) {
                  dmg = Math.round(actor.atk * 2.8);
                  target.popup = `💥-${dmg} 오답!`;
                  target.popupColor = 'bg-rose-500 text-white';
                } else {
                  target.popup = `-${dmg}`;
                  target.popupColor = 'bg-rose-600 text-white';
                }
                if (actor.team === 'ally' && comboActive && target.star >= 2) dmg = Math.round(dmg * 1.4);
                applyDmg(target, dmg);
              } else {
                const dmg = actor.atk + (actor.team === 'ally' && traitCounts.mbti_t >= 2 && actor.traits.includes('mbti_t') ? 40 : 0);
                target.popup = `-${dmg}`;
                target.popupColor = 'bg-slate-900/90 text-rose-300';
                applyDmg(target, dmg);
              }
            });
            return next;
          });
        }, 620);
        return () => clearInterval(id);
      }, [phase, comboActive, traitCounts]);

      function applyDmg(target, dmg) {
        if (target.shield >= dmg) target.shield -= dmg;
        else { target.hp = Math.max(0, target.hp - (dmg - target.shield)); target.shield = 0; }
      }

      const finishCombat = (win, enemyLeft) => {
        setPhase('RESULT');
        const interest = Math.min(5, Math.floor(gold / 10));
        const reward = 5 + interest + (win ? 1 : 0);
        if (win) setBanner({ win: true, text: `🏆 VICTORY (+${reward}G)` });
        else {
          const loss = enemyLeft * 8;
          setHp(h => Math.max(0, h - loss));
          setBanner({ win: false, text: `💔 DEFEAT (-${loss} HP · +${reward}G)` });
        }
        setTimeout(() => {
          setGold(g => g + reward);
          setStageIdx(s => s + 1);
          setBanner(null);
          setTimeLeft(25);
          setPhase('PREP');
          rollShop(0);
        }, 2000);
      };

      const curStage = STAGES[stageIdx % STAGES.length];
      const interestGold = Math.min(5, Math.floor(gold / 10));
      const renderedUnits = useMemo(() => {
        if (phase === 'COMBAT' || phase === 'RESULT') return combatUnits.filter(u => u.hp > 0);
        const enemies = curStage.units.map((eu, i) => ({ ...spawnUnit(eu.champId, eu.star), uid: `ep_${i}`, row: eu.row, col: eu.col, team: 'enemy' }));
        return [...boardUnits, ...enemies];
      }, [phase, combatUnits, boardUnits, curStage]);

      return html`
        <div className="h-screen w-screen flex flex-col justify-between bg-[#05070e] text-slate-100 overflow-hidden">
          <header className="h-12 shrink-0 bg-slate-900/95 border-b border-slate-800 px-4 flex items-center justify-between z-30">
            <div className="flex items-center gap-2.5">
              <span className="px-2.5 py-1 rounded-lg bg-amber-500 text-slate-950 font-black text-xs">${curStage.stage}</span>
              <span className="px-2.5 py-1 rounded-lg bg-slate-800 text-emerald-400 font-black text-xs">❤️ ${hp}</span>
              <span className="px-2.5 py-1 rounded-lg bg-slate-800 text-sky-300 font-black text-xs">👥 ${boardUnits.length}/${level}</span>
            </div>
            <div className="flex items-center gap-2.5">
              <div className="w-36 sm:w-52 h-2.5 bg-slate-800 rounded-full overflow-hidden border border-slate-700">
                <div style=${{ width: `${phase === 'PREP' ? (timeLeft / 25) * 100 : 100}%` }} className=${`h-full transition-all duration-500 ${phase === 'PREP' ? 'bg-emerald-400' : 'bg-rose-500'}`} />
              </div>
              <span className="font-mono font-black text-sm text-amber-300 w-8">${phase === 'PREP' ? `${timeLeft}s` : '⚔️'}</span>
            </div>
            <div className="flex items-center gap-2">
              <div className="flex bg-slate-950 p-1 rounded-lg border border-slate-800 gap-1">
                ${Object.values(ARENAS).map(a => html`
                  <button key=${a.id} onClick=${() => setArenaId(a.id)} className=${`w-7 h-7 rounded flex items-center justify-center text-sm transition ${arenaId === a.id ? 'bg-amber-400 text-slate-950' : 'opacity-50 hover:opacity-100'}`}>
                    ${a.icon}
                  </button>
                `)}
              </div>
              <button onClick=${startCombat} disabled=${phase !== 'PREP'} className="px-3.5 py-1.5 rounded-lg bg-gradient-to-r from-rose-500 to-pink-600 hover:brightness-110 disabled:opacity-40 text-white font-black text-xs shadow">
                ⚔️ 전투
              </button>
            </div>
          </header>

          <div className="flex-1 flex overflow-hidden relative">
            <aside className="w-32 shrink-0 bg-slate-900/75 border-r border-slate-800/80 p-2 flex flex-col gap-1.5 justify-center z-20">
              ${comboActive && html`
                <div className="px-2 py-1.5 rounded-xl bg-amber-500/20 border border-amber-400 text-amber-300 text-[11px] font-black text-center animate-pulse">
                  🔥 솔로천국
                </div>
              `}
              ${Object.values(SYNERGIES).map(syn => {
                const cnt = traitCounts[syn.id] || 0;
                const active = cnt >= syn.thresholds[0];
                return html`
                  <div key=${syn.id} title=${syn.desc} className=${`px-2.5 py-1.5 rounded-xl border flex items-center justify-between transition ${active ? 'bg-slate-800 border-amber-400 text-white shadow' : 'bg-slate-950/50 border-slate-800/70 text-slate-500'}`}>
                    <div className="flex items-center gap-1.5">
                      <span className="text-base">${syn.icon}</span>
                      <span className="text-xs font-extrabold">${syn.name}</span>
                    </div>
                    <span className=${`font-mono text-xs font-black px-1.5 rounded ${active ? 'bg-amber-400 text-slate-950' : 'text-slate-600'}`}>
                      ${cnt}
                    </span>
                  </div>
                `;
              })}
            </aside>

            <main className="flex-1 flex flex-col items-center justify-between p-2.5 overflow-hidden relative">
              ${banner && html`
                <div className="absolute inset-0 z-40 flex items-center justify-center pointer-events-none">
                  <div className=${`px-8 py-3.5 rounded-2xl border-2 font-black text-2xl shadow-2xl backdrop-blur-md ${banner.win ? 'bg-emerald-950/90 border-emerald-400 text-emerald-200' : 'bg-rose-950/90 border-rose-400 text-rose-200'}`}>
                    ${banner.text}
                  </div>
                </div>
              `}

              <div className="w-full max-w-5xl flex-1 flex items-center justify-center tft-stage-wrap my-auto">
                <div className=${`w-full rounded-3xl border-2 px-6 py-4 tft-arena-surface flex items-center gap-4 ${arena.surface}`}>
                  <div className="hidden sm:flex flex-col gap-2 py-2">
                    ${[5, 4, 3, 2, 1].map(step => html`
                      <div key=${step} className=${`w-4 h-4 rounded-full border transition-all ${interestGold >= step ? 'bg-amber-400 border-yellow-100 shadow-[0_0_10px_#fbbf24] scale-110' : 'bg-slate-900 border-slate-700 opacity-30'}`} />
                    `)}
                  </div>
                  <div className="flex-1 flex flex-col gap-2">
                    ${[0, 1, 2, 3].map(row => html`
                      <div key=${row} className="flex flex-col gap-2">
                        ${row === 2 && html`<div className="h-0.5 w-full bg-gradient-to-r from-transparent via-white/25 to-transparent my-0.5" />`}
                        <div className=${`grid grid-cols-7 gap-2.5 ${row % 2 === 1 ? 'pl-7 pr-1' : 'pr-7 pl-1'}`}>
                          ${[0, 1, 2, 3, 4, 5, 6].map(col => {
                            const unit = renderedUnits.find(u => u.row === row && u.col === col);
                            const isAllyRow = row >= 2;
                            const isSel = selected && selected.from === 'board' && unit && selected.uid === unit.uid;
                            const isIso = unit && unit.team === 'ally' && isolatedSet.has(unit.uid);
                            return html`
                              <div
                                key=${`${row}-${col}`}
                                onClick=${() => {
                                  if (phase !== 'PREP' || row < 2) return;
                                  if (!selected && unit) setSelected({ from: 'board', uid: unit.uid });
                                  else if (selected) moveUnit(selected, { type: 'board', row, col });
                                }}
                                onDragOver=${e => e.preventDefault()}
                                onDrop=${() => moveUnit(dragSource, { type: 'board', row, col })}
                                className=${`h-24 md:h-28 rounded-2xl border-2 flex flex-col items-center justify-end pb-1.5 cursor-pointer transition shadow-[0_6px_0_rgba(0,0,0,0.45)] ${isAllyRow ? arena.allyTile : arena.enemyTile} ${isSel ? 'ring-4 ring-amber-400 scale-105 z-20' : ''}`}
                              >
                                ${unit && html`
                                  <div
                                    draggable=${phase === 'PREP' && unit.team === 'ally'}
                                    onDragStart=${() => setDragSource({ from: 'board', uid: unit.uid })}
                                    className=${`relative flex flex-col items-center w-full ${unit.animState || 'anim-idle'}`}
                                  >
                                    ${unit.popup && html`
                                      <div className=${`absolute -top-8 left-1/2 px-2 py-0.5 rounded-lg font-black text-xs whitespace-nowrap shadow-xl border border-white/60 z-30 anim-float ${unit.popupColor}`}>
                                        ${unit.popup}
                                      </div>
                                    `}
                                    ${phase === 'PREP' && isIso && html`<span className="absolute -top-3 right-1 text-xs drop-shadow">👑</span>`}
                                    <div className="flex items-center gap-1 mb-0.5 z-10">
                                      <span className=${`text-[10px] font-black ${unit.star === 3 ? 'text-amber-300' : unit.star === 2 ? 'text-sky-300' : 'text-slate-300'}`}>
                                        ${'★'.repeat(unit.star)}
                                      </span>
                                      <div className="w-12 h-2 bg-slate-950 rounded-full overflow-hidden border border-black">
                                        <div style=${{ width: `${Math.max(0, Math.min(100, (unit.hp / unit.maxHp) * 100))}%` }} className=${`h-full transition-all duration-200 ${unit.team === 'ally' ? 'bg-emerald-400' : 'bg-rose-500'}`} />
                                      </div>
                                    </div>
                                    <div className="w-12 h-1 bg-slate-950 rounded-full overflow-hidden mb-0.5 z-10">
                                      <div style=${{ width: `${Math.min(100, (unit.mana / unit.maxMana) * 100)}%` }} className="h-full bg-sky-400 transition-all duration-200" />
                                    </div>
                                    <div className="-my-1.5">
                                      <${Chibi3DModel} champId=${unit.champId} cost=${unit.cost} star=${unit.star} size=${64} isEnemy=${unit.team === 'enemy'} />
                                    </div>
                                  </div>
                                `}
                              </div>
                            `;
                          })}
                        </div>
                      </div>
                    `)}
                  </div>
                </div>
              </div>

              <div className="w-full max-w-4xl mt-2 bg-slate-900/95 border-2 border-slate-700/90 rounded-2xl p-2 shadow-xl z-20">
                <div className="grid grid-cols-9 gap-2">
                  ${benchUnits.map((u, idx) => {
                    const isSel = selected && selected.from === 'bench' && selected.index === idx;
                    const st = u ? COST_STYLE[u.cost] : null;
                    return html`
                      <div
                        key=${idx}
                        onClick=${() => {
                          if (phase !== 'PREP') return;
                          if (!selected && u) setSelected({ from: 'bench', index: idx, uid: u.uid });
                          else if (selected) moveUnit(selected, { type: 'bench', index: idx });
                        }}
                        onDragOver=${e => e.preventDefault()}
                        onDrop=${() => moveUnit(dragSource, { type: 'bench', index: idx })}
                        className=${`h-16 md:h-20 rounded-xl border-2 flex flex-col items-center justify-center cursor-pointer transition ${u ? `bg-gradient-to-b ${st.bg} ${st.border} hover:-translate-y-1` : 'bg-slate-950/75 border-slate-800/80 hover:border-slate-600'} ${isSel ? 'ring-4 ring-amber-400 scale-105' : ''}`}
                      >
                        ${u && html`
                          <div draggable=${phase === 'PREP'} onDragStart=${() => setDragSource({ from: 'bench', index: idx, uid: u.uid })} className="flex flex-col items-center">
                            <span className="text-[10px] font-black text-amber-300 leading-none">${'★'.repeat(u.star)}</span>
                            <div className="-my-2">
                              <${Chibi3DModel} champId=${u.champId} cost=${u.cost} star=${u.star} size=${50} />
                            </div>
                          </div>
                        `}
                      </div>
                    `;
                  })}
                </div>
              </div>
            </main>
          </div>

          <footer
            onDragOver=${e => e.preventDefault()}
            onDrop=${() => moveUnit(dragSource, { type: 'sell' })}
            className="h-28 shrink-0 bg-slate-900 border-t-2 border-slate-700 px-4 py-2 flex items-center gap-3 z-30 shadow-2xl"
          >
            <div className="w-40 shrink-0 flex flex-col gap-1.5">
              <button onClick=${buyXp} disabled=${phase !== 'PREP' || gold < 4} className="px-3 py-2 rounded-xl bg-gradient-to-r from-sky-600 to-blue-700 hover:brightness-110 disabled:opacity-40 text-white font-black text-xs flex items-center justify-between shadow">
                <span>⬆️ Lv.${level}</span>
                <span className="text-amber-300">4G</span>
              </button>
              <button onClick=${() => rollShop(2)} disabled=${phase !== 'PREP' || gold < 2} className="px-3 py-2 rounded-xl bg-gradient-to-r from-amber-500 to-yellow-600 hover:brightness-110 disabled:opacity-40 text-slate-950 font-black text-xs flex items-center justify-between shadow">
                <span>🔄 리롤</span>
                <span>2G</span>
              </button>
            </div>

            <div className="flex-1 grid grid-cols-5 gap-2.5 h-full">
              ${shop.map((card, idx) => {
                if (!card || card.sold) return html`<div key=${idx} className="rounded-xl bg-slate-950/50 border border-slate-800/60" />`;
                const st = COST_STYLE[card.cost];
                const owned = boardUnits.filter(u => u.champId === card.id).length + benchUnits.filter(u => u && u.champId === card.id).length;
                return html`
                  <div key=${idx} onClick=${() => buyCard(idx)} className=${`relative rounded-xl bg-gradient-to-b ${st.bg} border-2 ${st.border} flex flex-col justify-between overflow-hidden cursor-pointer hover:-translate-y-1 transition shadow-lg`}>
                    <div className="flex items-center justify-between px-2 pt-1.5 z-10">
                      <div className="flex gap-1">
                        ${card.traits.map(t => html`<span key=${t} className="text-xs bg-black/50 px-1 rounded">${SYNERGIES[t].icon}</span>`)}
                      </div>
                      ${owned >= 2 && html`<span className="px-1.5 py-0.5 rounded-full bg-amber-400 text-slate-950 font-black text-[9px] animate-bounce">★2</span>`}
                    </div>
                    <div className="flex justify-center -my-3 pointer-events-none">
                      <${Chibi3DModel} champId=${card.id} cost=${card.cost} star=${1} size=${64} />
                    </div>
                    <div className="bg-black/75 px-2.5 py-1 flex items-center justify-between z-10">
                      <span className="text-xs font-extrabold text-white truncate">${card.name}</span>
                      <span className=${`px-1.5 py-0.5 rounded font-black text-[10px] ${st.badge}`}>🪙${card.cost}</span>
                    </div>
                  </div>
                `;
              })}
            </div>

            <div
              onClick=${() => selected && moveUnit(selected, { type: 'sell' })}
              className=${`w-32 shrink-0 h-full rounded-xl border-2 flex flex-col justify-center items-center cursor-pointer transition ${selected ? 'bg-rose-950/90 border-rose-400 animate-pulse' : 'bg-slate-950 border-amber-500/50'}`}
            >
              ${selected ? html`
                <div className="text-center">
                  <div className="text-xs font-black text-rose-300">🗑️ 판매하기</div>
                  <div className="text-[10px] text-rose-200 mt-0.5">클릭 또는 드롭</div>
                </div>
              ` : html`
                <div className="text-center">
                  <div className="text-2xl font-black text-amber-300">🪙 ${gold}</div>
                  <div className="text-[10px] font-bold text-emerald-400">이자 +${interestGold}G</div>
                </div>
              `}
            </div>
          </footer>
        </div>
      `;
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(React.createElement(App));
  </script>
</body>
</html>
